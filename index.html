<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FZK XITER - GERADOR DE KEY</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, #600000 0%, #260000 30%, #090000 65%, #000000 100%);
    color: #fff;
    overflow-x: hidden;
}

/* FUNDO */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255, 0, 0, .14) 50%,
            transparent 65%
        );
    animation: brilhoFundo 6s linear infinite;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 0, .10), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 0, .08), transparent 25%);
    animation: pulsarFundo 5s ease-in-out infinite alternate;
    z-index: 0;
}

@keyframes brilhoFundo {
    0% {
        transform: translateX(-45%);
    }

    100% {
        transform: translateX(45%);
    }
}

@keyframes pulsarFundo {
    from {
        opacity: .5;
        transform: scale(1);
    }

    to {
        opacity: 1;
        transform: scale(1.08);
    }
}

/* PARTÍCULAS */

.particle {
    position: fixed;
    bottom: -20px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ff0000;
    box-shadow:
        0 0 8px #ff0000,
        0 0 18px #ff0000,
        0 0 30px rgba(255, 0, 0, .7);
    animation: subir linear infinite;
    pointer-events: none;
    z-index: 1;
}

.particle:nth-child(3n) {
    width: 2px;
    height: 2px;
    background: #ffffff;
}

.particle:nth-child(4n) {
    width: 4px;
    height: 4px;
    box-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff0000;
}

@keyframes subir {
    0% {
        transform: translateY(110vh) translateX(0) scale(.4);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    50% {
        transform: translateY(50vh) translateX(25px) scale(1);
    }

    85% {
        opacity: 1;
    }

    100% {
        transform: translateY(-15vh) translateX(-25px) scale(.3);
        opacity: 0;
    }
}

/* CONTAINER */

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 35px 18px 30px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* LOGO */

.logo {
    width: 100%;
    text-align: center;
    margin-bottom: 8px;
}

.logo h1 {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -2px;

    text-shadow:
        0 0 10px rgba(255, 0, 0, .8),
        0 0 25px rgba(255, 0, 0, .5);
}

.logo h1 span {
    color: #ff0000;
}

.logo p {
    margin-top: 6px;
    color: #ffffff;
    font-size: 13px;
    letter-spacing: 5px;
}

/* ONLINE */

.online {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin: 22px 0;
}

.online-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;

    background: #00ff66;

    box-shadow:
        0 0 10px #00ff66,
        0 0 22px rgba(0, 255, 100, .5);

    animation: onlinePulse 1.2s infinite;
}

@keyframes onlinePulse {
    50% {
        opacity: .35;
        transform: scale(.75);
    }
}

.online span {
    color: #00ff66;
    font-size: 14px;
    font-weight: 800;
}

/* CARD */

.card {
    width: 100%;
    position: relative;

    padding: 40px 25px 32px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(35, 0, 0, .98),
            rgba(2, 2, 2, .99)
        );

    border: 2px solid #ff0000;

    box-shadow:
        0 0 15px rgba(255, 0, 0, .75),
        0 0 45px rgba(255, 0, 0, .25),
        inset 0 0 35px rgba(255, 0, 0, .08);

    backdrop-filter: blur(8px);
}

/* TÍTULO */

.title {
    width: 100%;
    text-align: center;

    font-size: 34px;
    font-weight: 900;

    margin-bottom: 25px;

    color: #ffffff;

    text-shadow:
        0 0 15px rgba(255, 0, 0, .6);
}

/* BOTÃO GERAR */

.generate {
    width: 100%;
    height: 65px;

    border: 2px solid #ff3333;
    border-radius: 17px;

    background:
        linear-gradient(
            90deg,
            #700000,
            #ff0000,
            #700000
        );

    background-size: 200% 100%;

    color: #ffffff;

    font-size: 17px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255, 0, 0, .8),
        inset 0 0 20px rgba(255, 255, 255, .08);

    transition: .2s;

    animation: botaoBrilho 3s linear infinite;
}

@keyframes botaoBrilho {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 200% 50%;
    }
}

.generate:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 25px rgba(255, 0, 0, 1),
        0 0 45px rgba(255, 0, 0, .35);
}

.generate:active {
    transform: scale(.97);
}

/* REDES */

#socials {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.social-title {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;

    color: #ffffff;

    font-size: 11px;
    letter-spacing: 2px;

    margin: 28px 0 15px;

    text-align: center;
}

.social-title::before,
.social-title::after {
    content: "";

    height: 1px;

    flex: 1;

    background: #ff0000;

    box-shadow:
        0 0 8px #ff0000;
}

/* BOTÃO WHATSAPP */

.social {
    width: 100%;
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px 16px;
    margin-bottom: 13px;

    border-radius: 15px;

    text-decoration: none;

    color: #ffffff;

    font-size: 13px;
    font-weight: 900;

    text-align: center;
    line-height: 1.2;

    transition: .2s;

    /* GARANTE QUE APAREÇA */
    opacity: 1;
    visibility: visible;
}

.social svg {
    width: 28px;
    height: 28px;

    fill: #ffffff;

    flex-shrink: 0;

    margin-right: 12px;

    display: block;
}

.social:hover {
    transform: translateY(-2px);
}

.social:active {
    transform: scale(.97);
}

/* WHATSAPP VERMELHO */

.whatsapp {
    display: flex !important;

    background:
        linear-gradient(
            90deg,
            #700000,
            #ff0000
        ) !important;

    border: 2px solid #ff3333 !important;

    box-shadow:
        0 0 18px rgba(255, 0, 0, .55),
        inset 0 0 15px rgba(255, 255, 255, .08);

    color: #ffffff !important;
}

/* RESULTADO */

#result {
    width: 100%;

    display: none;

    text-align: center;

    animation: aparecer .4s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.success-icon {
    width: 65px;
    height: 65px;

    margin: 0 auto 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid #00ff66;

    color: #00ff66;

    font-size: 32px;
    font-weight: bold;

    box-shadow:
        0 0 20px rgba(0, 255, 100, .5);
}

.success h2 {
    color: #ffffff;

    font-size: 20px;

    margin-bottom: 8px;
}

.success p {
    color: #ffffff;

    font-size: 13px;

    margin-bottom: 25px;
}

/* KEY */

.key-area {
    width: 100%;

    padding: 23px 15px;

    border-radius: 18px;

    background: rgba(15, 0, 0, .90);

    border: 2px solid #cc0000;

    box-shadow:
        inset 0 0 25px rgba(255, 0, 0, .08),
        0 0 15px rgba(255, 0, 0, .2);

    margin-bottom: 17px;
}

.key-label {
    display: block;

    color: #ffffff;

    font-size: 12px;

    letter-spacing: 1.5px;

    margin-bottom: 12px;
}

#generatedKey {
    color: #ffffff;

    font-size: 17px;
    font-weight: 900;

    word-break: break-word;

    text-shadow:
        0 0 10px rgba(255, 0, 0, .7);
}

/* COPIAR */

.copy {
    width: 100%;
    height: 58px;

    border: 2px solid #ff3333;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #700000,
            #ff0000
        );

    color: #ffffff;

    font-size: 15px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 0 18px rgba(255, 0, 0, .5);

    transition: .2s;
}

.copy:hover {
    background: #cc0000;
}

.copy:active {
    transform: scale(.97);
}

/* FOOTER */

footer {
    width: 100%;

    text-align: center;

    margin-top: 25px;

    padding-bottom: 10px;
}

footer p {
    color: #ffffff;

    font-size: 11px;

    letter-spacing: 2px;
}

footer strong {
    color: #ff0000;
}

/* TOAST */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translate(-50%, 100px);

    padding: 13px 20px;

    background: #080000;

    border: 1px solid #ff0000;

    border-radius: 10px;

    color: #ffffff;

    font-size: 12px;
    font-weight: bold;

    opacity: 0;

    z-index: 100;

    transition: .3s;

    box-shadow:
        0 0 20px rgba(255, 0, 0, .5);

    white-space: nowrap;
}

.toast.show {
    transform: translate(-50%, 0);

    opacity: 1;
}
</style>
</head>

<body>

<!-- PARTÍCULAS -->

<div class="particle" style="left:5%;animation-duration:8s;"></div>

<div class="container">

            <div id="socials">

                <div class="social-title">

                </div>

                <a
                    id="whatsappButton"
                    class="social whatsapp"
                    href="https://chat.whatsapp.com/BnCzPWdluMBIyNHR4cXW8w"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <!-- ÍCONE WHATSAPP -->

                    <svg
                        viewBox="0 0 24 24"

                        aria-hidden="true"
                    >
                        <path d="M12 2C6.49 2 2 6.49 2 12c0 1.77.46 3.44 1.34 4.94L2 22l5.22-1.32A9.94 9.94 0 0 0 12 22c5.51 0 10-4.49 10-10S17.51 2 12 2Zm0 18.2c-1.55 0-3.07-.42-4.4-1.22l-.31-.18-3.1.79.8-3.02-.2-.32A8.18 8.18 0 1 1 12 20.2Zm4.48-6.13c-.24-.12-1.41-.7-1.63-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1-.37-1.91-1.18-.7-.62-1.17-1.4-1.31-1.64-.14-.24-.01-.37.1-.48.1-.1.24-.27.36-.41.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.11.16 1.53.1.47-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"/>
                    </svg>

<script>

/* =========================
   KEY
========================= */

const KEY = "FZKXITER04";


/* =========================
   ELEMENTOS
========================= */

const generateButton =
    document.getElementById("generateButton");

const copyButton =
    document.getElementById("copyButton");

const generator =
    document.getElementById("generator");

const result =
    document.getElementById("result");

const generatedKey =
    document.getElementById("generatedKey");

const toast =
    document.getElementById("toast");


/* =========================
   GERAR KEY
========================= */

generateButton.addEventListener("click", function () {

    generatedKey.textContent = KEY;

    generator.style.display = "none";

    result.style.display = "block";

    showToast("KEY GERADA COM SUCESSO!");

});


/* =========================
   COPIAR KEY
========================= */

copyButton.addEventListener("click", function () {

    const key = generatedKey.textContent;

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard.writeText(key)

            .then(function () {

                showToast(
                    "KEY COPIADA COM SUCESSO!"
                );

            })

            .catch(function () {

                fallbackCopy(key);

            });

    } else {

        fallbackCopy(key);

    }

});


/* =========================
   FALLBACK
========================= */

function fallbackCopy(text) {

    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    try {

        document.execCommand("copy");

        showToast(
            "KEY COPIADA COM SUCESSO!"
        );

    } catch (error) {

        showToast(
            "NÃO FOI POSSÍVEL COPIAR!"
        );

    }

    document.body.removeChild(textarea);

}


/* =========================
   TOAST
========================= */

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function () {

        toast.classList.remove("show");

    }, 2200);

}

</script>
